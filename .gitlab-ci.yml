image: gitlab.chab.ethz.ch:4567/reiher/docker/scine-gcc:latest

# Pipeline that compiles the code with increasingly complex models
 
stages:
  - buildBasic
  - testBasic  
  - buildAdvanced
  - testAdvanced
  - buildFinal
  - testFinal

# For now, set the necessary paths to utilize Eigen 3.4.0 for each stage
before_script:
  - export CMAKE_PREFIX_PATH="/reiher_data/soft/centos7/libraries/Eigen/3.4.0/share/eigen3/cmake:$CMAKE_PREFIX_PATH"
  - export CPLUS_INCLUDE_PATH="/reiher_data/soft/centos7/libraries/Eigen/3.4.0/include/eigen3:$CPLUS_INCLUDE_PATH"

# Conventional electronic-structure tests
build-electronic:
  stage: buildBasic
  tags:
    - default_docker
  script:
    - cmake -B buildElectronic -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="TwoU1;TwoU1PG;SU2U1;SU2U1PG" -DCMAKE_BUILD_TYPE=Release -DBUILD_DMRG_FEAST=ON -DBUILD_SRCAS=ON dmrg
    - cmake --build buildElectronic -j2
  artifacts:
    paths:
      - buildElectronic/
    expire_in: 6h
    when: always

testElectronic:
  stage: testBasic
  needs: ["build-electronic"]
  tags:
    - default_docker
  script:
    - cd buildElectronic
    - make CTEST_OUTPUT_ON_FAILURE=1 test

# Relativistic electronic-structure tests
build-relativistic:
  stage: buildAdvanced
  tags:
    - default_docker
  script:
    - cmake -B buildRelativistic -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="TwoU1;TwoU1PG;SU2U1;SU2U1PG;U1DG" -DCMAKE_BUILD_TYPE=Release dmrg
    - cmake --build buildRelativistic -j2
  artifacts:
    paths:
      - buildRelativistic/
    expire_in: 6h
    when: always

testRelativistic:
  stage: testAdvanced
  needs: ["build-relativistic"]
  tags:
    - default_docker
  script:
    - cd buildRelativistic
    - make CTEST_OUTPUT_ON_FAILURE=1 test

# Non-electronic-structure tests
buildPreBO:
  stage: buildFinal
  tags:
    - default_docker
  script:
    - cmake -B buildNU1 -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="TwoU1;TwoU1PG;SU2U1;SU2U1PG;U1DG;NU1" -DCMAKE_BUILD_TYPE=Release -DBUILD_PREBO=ON -DDMRG_NUMSYMM=5 dmrg
    - cmake --build buildNU1 -j2
  artifacts:
    paths:
      - buildNU1/
    expire_in: 6h
    when: always

testPreBO:
  stage: testFinal
  needs: ["buildPreBO"]
  tags:
    - default_docker
  script:
    - cd buildNU1
    - make CTEST_OUTPUT_ON_FAILURE=1 test

buildVibrationalHamiltonians:
  stage: buildFinal
  tags:
    - default_docker
  script:
    - cmake -B buildVibrational -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="NU1;NONE" -DCMAKE_BUILD_TYPE=Release -DBUILD_VIBRATIONAL=ON -DBUILD_DMRG_FEAST=ON -DBUILD_SRCAS=ON -DBUILD_MPS2CI=ON -DDMRG_NUMSYMM=5 -DDMRG_ORDERNONE=12 dmrg
    - cmake --build buildVibrational -j2
  artifacts:
    paths:
      - buildVibrational/
    expire_in: 6h
    when: always

testVibrationalHamiltonians:
  stage: testFinal
  needs: ["buildVibrationalHamiltonians"]
  tags:
    - default_docker
  script:
    - cd buildVibrational
    - make CTEST_OUTPUT_ON_FAILURE=1 test

buildVibronicHamiltonians:
  stage: buildFinal
  tags:
    - default_docker
  script:
    - cmake -B buildVibronic -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="TwoU1PG;SU2U1PG;NU1;U1" -DCMAKE_BUILD_TYPE=Release -DBUILD_VIBRONIC=ON dmrg
    - cmake --build buildVibronic -j2
  artifacts:
    paths:
      - buildVibronic/
    expire_in: 6h
    when: always

testVibronicHamiltonians:
  stage: testFinal
  needs: ["buildVibronicHamiltonians"]
  tags:
    - default_docker
  script:
    - cd buildVibronic
    - make CTEST_OUTPUT_ON_FAILURE=1 test

# +-----------------------------+
#  Pipeline for the TD-DMRG case
# +-----------------------------+

# Tests TD-DMRG with Electronic Hamiltonians
build-TD-conventional:
  stage: buildBasic
  tags:
    - default_docker
  script:
    - cmake -B buildTDConventional -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="TwoU1;TwoU1PG;SU2U1;SU2U1PG" -DCMAKE_BUILD_TYPE=Release -DBUILD_DMRG_EVOLVE=ON -DBUILD_TRANSCORRELATED_DMRG=ON dmrg
    - cmake --build buildTDConventional -j2
  artifacts:
    paths:
      - buildTDConventional/
    expire_in: 6h
    when: always

testTDConventional:
  stage: testBasic
  needs: ["build-TD-conventional"]
  tags:
    - default_docker
  script:
    - cd buildTDConventional
    - make CTEST_OUTPUT_ON_FAILURE=1 test

# Tests TD-DMRG with all Hamiltonians
build-TD-with-all-symmetries:
  stage: buildAdvanced
  tags:
    - default_docker
  script:
    - cmake -B buildTDAllSymmetries -DQCMAQUIS_TESTS=ON -DBUILD_SYMMETRIES="TwoU1;TwoU1PG;SU2U1;SU2U1PG;U1DG;NU1;U1" -DCMAKE_BUILD_TYPE=Release -DBUILD_DMRG_EVOLVE=ON -DBUILD_PREBO=ON -DBUILD_VIBRONIC=ON -DBUILD_MPS2CI=ON -DBUILD_MPS_OVERLAP=ON -DBUILD_TRANSCORRELATED_DMRG=ON dmrg
    - cmake --build buildTDAllSymmetries -j2
  artifacts:
    paths:
      - buildTDAllSymmetries/
    expire_in: 6h
    when: always

testTDAllSymmetries:
  stage: testAdvanced
  needs: ["build-TD-with-all-symmetries"]
  tags:
    - default_docker
  script:
    - cd buildTDAllSymmetries
    - make CTEST_OUTPUT_ON_FAILURE=1 test
